<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Assistant</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#dfe9fb" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#070b16" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#eaf1fb;--surface:#fff;--tint:#f1f5fc;--ink:#0f1b2d;--ink2:#52637c;--ink3:#8392a8;--line:rgba(15,27,45,.08);--dot:rgba(15,27,45,.075);
  --accent:#3b6fe0;--accent-ink:#fff;--navy:#0f1b2d;--navy-ink:#fff;--ok:#1e8a5a;--warn:#b25e09;
  --mint:#dcf2e7;--mint-ink:#1c6b49;--sand:#f4e6d5;--sand-ink:#7a5226;--sky:#dcebfb;--sky-ink:#235a9d;--rose:#f7e4f4;--rose-ink:#a8379a;
  --t1:linear-gradient(160deg,#bddcfa,#6ea6ee);--t2:linear-gradient(160deg,#f9e6d2,#ecc79d);--t3:linear-gradient(160deg,#d5f1e5,#8fd2b4);--t4:linear-gradient(160deg,#ece1f9,#c8acf0);--t5:linear-gradient(160deg,#fbdeed,#efa9cd);--tile-ink:#0f1b2d;
  --shadow:0 1px 2px rgba(15,27,45,.04),0 10px 30px rgba(15,27,45,.07);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0b1220;--surface:#131c2f;--tint:#18233a;--ink:#e8eef9;--ink2:#a3b0c6;--ink3:#74839b;--line:rgba(232,238,249,.09);--dot:rgba(232,238,249,.06);
  --accent:#6f95ff;--accent-ink:#0a1226;--navy:#e8eef9;--navy-ink:#0b1220;--ok:#4ade80;--warn:#f2b45a;
  --mint:#173a2c;--mint-ink:#8fe0b9;--sand:#3a2c1b;--sand-ink:#f0c995;--sky:#162e4d;--sky-ink:#9cc5f5;--rose:#3a1d38;--rose-ink:#f0a8e6;
  --t1:linear-gradient(160deg,#2a4a78,#1b3358);--t2:linear-gradient(160deg,#4a3826,#33261a);--t3:linear-gradient(160deg,#1f4a39,#163527);--t4:linear-gradient(160deg,#3f2f63,#2a2045);--t5:linear-gradient(160deg,#5a2a4a,#3d1c33);--tile-ink:#eaf1ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.3);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.3px);background-size:15px 15px}
.num{font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar + segmented tabs */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.brand{font:700 18px ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:-.02em}
.actions{display:flex;align-items:center;gap:4px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink2);position:relative}
.icon-btn:active{background:var(--line)}
.net{width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:2px}.net.bad{background:var(--warn)}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:4px 16px 12px;padding:4px;border-radius:999px;background:color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:0 0 0 1px var(--line)}
.seg .knob{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:var(--navy);transition:transform .3s cubic-bezier(.3,.8,.2,1)}
.seg.chat .knob{transform:translateX(100%)}
.seg button{position:relative;z-index:1;height:38px;border:0;background:none;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink2);transition:color .25s;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-selected=true]{color:var(--navy-ink)}
.dotbadge{width:8px;height:8px;border-radius:50%;background:var(--accent);display:none}.dotbadge.on{display:block}

main{flex:1;min-height:0;position:relative;overflow:hidden;overflow:clip}
#panes{display:flex;width:200%;height:100%;transition:transform .34s cubic-bezier(.3,.8,.2,1)}
.pane{width:50%;height:100%;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}

/* home */
.hero{padding:6px 20px 14px}
.eyebrow{font-size:13px;color:var(--ink3);font-weight:500}
h1{margin:2px 0 6px;font-size:28px;line-height:1.12;letter-spacing:-.025em;font-weight:680}
.smart{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-size:14px;background:none;border:0;padding:0;text-align:left;font-weight:500}
button.smart{color:var(--accent)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:0 20px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.tile{flex:none;width:150px;height:136px;border-radius:22px;border:0;padding:12px;display:flex;flex-direction:column;align-items:flex-start;color:var(--tile-ink);scroll-snap-align:start;text-align:left}
.tile:active{transform:scale(.98)}
.tile .ti{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center}
.tile .ti svg{width:16px;height:16px}
.tile .tv{margin-top:auto;font-size:23px;font-weight:680;letter-spacing:-.02em;line-height:1.1;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .tl{margin-top:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.55);padding:3px 9px;border-radius:999px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(prefers-color-scheme:dark){.tile .ti,.tile .tl{background:rgba(255,255,255,.12)}}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}.t5{background:var(--t5)}
.panel{background:var(--surface);border-radius:28px 28px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom) + 110px);min-height:60%;box-shadow:0 -1px 0 var(--line)}
.block{margin-bottom:22px}
.block>h2{margin:0 4px 10px;font-size:17px;font-weight:680;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:baseline}
.block>h2 small{font-size:13px;font-weight:500;color:var(--ink3)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;min-height:54px;padding:10px 14px;border-radius:18px;background:var(--tint);width:100%;border:0;text-align:left}
button.item:active{filter:brightness(.97)}
.item .grow{flex:1;min-width:0}.t1x{font-weight:550;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.t2x{font-size:13px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipicon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--rose);color:var(--rose-ink);flex:none}.chipicon svg{width:16px;height:16px}
.check{width:24px;height:24px;border-radius:50%;border:1.8px solid var(--ink3);background:none;padding:0;display:grid;place-items:center;color:transparent;flex:none;transition:all .15s}
.check svg{width:14px;height:14px;stroke-width:3}.check:active{border-color:var(--ok);color:var(--ok);background:var(--mint)}
.item.gone{opacity:0;transform:translateX(14px) scale(.98);transition:all .22s}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--sky);color:var(--sky-ink);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.right{color:var(--ink2);font-size:13px;white-space:nowrap}
.soon{font-size:12px;color:var(--sand-ink);background:var(--sand);padding:3px 9px;border-radius:999px;font-weight:650;white-space:nowrap}
.addrow{display:flex;gap:8px;margin-top:8px}.addrow input{flex:1;min-width:0;height:44px;border:0;border-radius:18px;background:var(--tint);color:var(--ink);padding:0 16px;font-size:15px}
.addrow input::placeholder{color:var(--ink3)}
.quiet{color:var(--ink3);font-size:14px;padding:4px 6px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:650;padding:0;font-size:14px}
.callout{display:flex;gap:12px;align-items:center;background:var(--sky);color:var(--sky-ink);border-radius:20px;padding:14px 16px;margin:0 16px 16px}
.callout .grow{flex:1}.callout b{display:block;color:var(--ink)}.callout span{font-size:13px;color:var(--ink2)}
.pillbtn{height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--navy);color:var(--navy-ink);font-weight:650;font-size:14px;white-space:nowrap}.pillbtn.ghost{background:none;color:var(--ink2)}
.approval{display:flex;flex-direction:column;gap:12px;background:var(--sand);color:var(--sand-ink);border-radius:20px;padding:14px 16px;margin:0 16px 16px}
.approval p{margin:0;font-weight:600;color:var(--ink)}.approval .acts{display:flex;gap:8px;margin-top:12px}.approval [data-pid] p{margin-top:2px!important}
.sk{height:54px;border-radius:18px;background:linear-gradient(90deg,var(--tint) 25%,var(--line) 50%,var(--tint) 75%);background-size:300% 100%;animation:sk 1.3s infinite}
@keyframes sk{to{background-position:-300% 0}}

/* chat */
.chathead{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px;background:linear-gradient(var(--bg) 65%,transparent)}
.focus{display:flex;align-items:center;gap:6px;height:38px;padding:0 6px 0 14px;border-radius:999px;border:0;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-weight:600;font-size:14px}
.menu{position:absolute;top:50px;z-index:6;min-width:230px;background:var(--surface);border-radius:18px;box-shadow:var(--shadow),0 0 0 1px var(--line);padding:6px;display:none}.menu.on{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px}.menu button:active,.menu button[aria-checked=true]{background:var(--tint)}
.menu small{display:block;color:var(--ink3);font-size:12px}
#log{padding:4px 16px 120px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-direction:column;max-width:88%}.row.me{align-self:flex-end;align-items:flex-end}.row.bot{align-self:flex-start}
.bubble{padding:10px 15px;border-radius:20px;overflow-wrap:anywhere}
.me .bubble{background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bot .bubble{background:var(--surface);box-shadow:0 0 0 1px var(--line);border-bottom-left-radius:6px;padding-top:8px}
.who{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:2px;min-height:26px}
.copy{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--ink3);display:grid;place-items:center;margin-right:-8px}.copy svg{width:16px;height:16px}
.meta{font-size:11px;color:var(--ink3);margin:3px 6px 6px}
.sys{align-self:center;text-align:center;color:var(--ink3);font-size:13px;padding:4px 10px}
.bubble p{margin:0}.bubble p+p,.bubble p+ul,.bubble ul+p,.bubble ol+p,.bubble p+ol{margin-top:8px}.bubble ul,.bubble ol{margin:0;padding-left:20px}.bubble li+li{margin-top:3px}
.bubble code{font:13px ui-monospace,Menlo,monospace;background:var(--tint);padding:1px 5px;border-radius:5px}.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.bubble .acts{display:flex;gap:8px;margin-top:10px}
.quick{align-self:flex-end;display:flex;flex-direction:column;align-items:flex-end;gap:8px;margin:4px 0 8px}
.quick button{border:0;border-radius:999px;height:38px;padding:0 16px;font-weight:600;font-size:14px}
.q1{background:var(--mint);color:var(--mint-ink)}.q2{background:var(--sand);color:var(--sand-ink)}.q3{background:var(--sky);color:var(--sky-ink)}
.typing{display:inline-flex;gap:4px;padding:6px 0}.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink3);animation:b 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.emptyhint{margin:18vh auto 0;max-width:260px;text-align:center;color:var(--ink3);font-size:14px}

/* persistent composer + inline answer */
.composer{display:flex;gap:8px;align-items:center;margin:0 12px calc(env(safe-area-inset-bottom) + 10px);padding:6px 6px 6px 18px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line);position:relative;z-index:5}
.composer input{flex:1;min-width:0;height:42px;border:0;background:none;color:var(--ink);font-size:16px;outline:none}
.composer input::placeholder{color:var(--ink3)}
.cbtn{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;transition:transform .15s}
.cbtn:active{transform:scale(.94)}
#mic{background:var(--tint);color:var(--ink2)}#send{background:var(--navy);color:var(--navy-ink);display:none}
.composer.typing-now #mic{display:none}.composer.typing-now #send{display:grid}
.peek{position:absolute;left:12px;right:12px;bottom:8px;max-height:52%;overflow:auto;background:var(--surface);border-radius:22px;box-shadow:var(--shadow),0 0 0 1px var(--line);padding:12px 14px;z-index:4;transform:translateY(calc(100% + 20px));opacity:0;transition:all .3s cubic-bezier(.3,.8,.2,1)}
.peek.on{transform:none;opacity:1}
.peek .ph{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--accent);margin-bottom:4px}
.peek .ph button{border:0;background:none;color:var(--ink3);padding:4px 2px;font-size:12px;font-weight:600}
.peek .body{overflow-wrap:anywhere}.peek p{margin:0}.peek p+p{margin-top:6px}.peek ul,.peek ol{margin:4px 0;padding-left:20px}
.peek .acts{display:flex;gap:8px;margin-top:10px}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(8,14,28,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 18px calc(env(safe-area-inset-bottom) + 22px);transform:translateY(105%);transition:transform .3s cubic-bezier(.3,.8,.2,1);z-index:21;max-height:88%;overflow:auto;max-width:560px;margin:0 auto}
.sheet.on{transform:none}.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}.group{margin-top:20px}.group h3{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase}
.field{display:flex;gap:8px}.field input{flex:1;min-width:0;height:44px;border:0;border-radius:14px;background:var(--tint);color:var(--ink);padding:0 14px;font-size:15px}
.kv{display:flex;justify-content:space-between;align-items:center;padding:12px 0;color:var(--ink2);font-size:14px}
.pill{font-size:12px;font-weight:650;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--ink2)}.pill.ok{background:var(--mint);color:var(--mint-ink)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 84px);transform:translate(-50%,20px);background:var(--navy);color:var(--navy-ink);padding:11px 16px;border-radius:14px;font-size:14px;opacity:0;pointer-events:none;transition:all .22s;z-index:30;max-width:90%;display:flex;gap:14px;align-items:center;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast button{background:none;border:0;color:var(--navy-ink);font-weight:700;text-decoration:underline;padding:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* widgets + edit mode */
.customize{display:block;margin:4px auto 0;background:none;border:0;color:var(--ink3);font-weight:600;font-size:14px;padding:10px 16px}
.block>h2 .wsmall{font-size:13px;font-weight:500;color:var(--ink3);margin-left:6px}
.ctl{display:none;gap:2px}.editing .ctl{display:flex}
.ctl button{width:32px;height:32px;border-radius:50%;border:0;background:var(--tint);color:var(--ink2);display:grid;place-items:center}.ctl svg{width:16px;height:16px}
.editing .block{border-radius:22px;outline:2px dashed color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:6px;margin-bottom:28px}
.editing .block .wbody{pointer-events:none;opacity:.78}
.editbar{position:absolute;left:12px;right:12px;bottom:8px;z-index:4;display:none;gap:8px;justify-content:center;padding:8px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.editbar.on{display:flex}.editbar .pillbtn{height:42px;flex:1}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid button{border:0;border-radius:18px;min-height:58px;padding:10px 14px;text-align:left;font-weight:650;font-size:14px}
.q4{background:var(--rose);color:var(--rose-ink)}
.note{width:100%;min-height:110px;border:0;border-radius:18px;background:var(--tint);color:var(--ink);padding:14px 16px;font:inherit;resize:vertical}
.note::placeholder{color:var(--ink3)}
.wxnow{display:flex;align-items:center;gap:14px;background:var(--tint);border-radius:18px;padding:14px 16px}
.wxbig{font-size:38px;font-weight:680;letter-spacing:-.03em;line-height:1}
.wxrow{display:flex;justify-content:space-between;margin-top:8px;background:var(--tint);border-radius:18px;padding:12px 8px}
.wxh{flex:1;text-align:center;font-size:12px;color:var(--ink3);display:flex;flex-direction:column;align-items:center;gap:6px}.wxh b{font-size:14px;color:var(--ink);font-weight:650}.wxh svg{width:18px;height:18px;color:var(--ink2)}
.timer{background:var(--tint);border-radius:18px;padding:16px;text-align:center}
.tnum{font-size:46px;font-weight:680;letter-spacing:-.03em;line-height:1.1}
.tlens{display:flex;justify-content:center;gap:8px;margin:8px 0 12px}.tlens button{border:0;border-radius:999px;height:32px;padding:0 14px;background:var(--surface);color:var(--ink2);font-weight:600;font-size:13px}.tlens button.on{background:var(--sky);color:var(--sky-ink)}
.tbtns{display:flex;gap:8px;justify-content:center}
.cd{display:flex;align-items:center;gap:14px;background:var(--tint);border-radius:18px;padding:14px 16px}.cd .grow{flex:1;min-width:0}
.cdnum{font-size:40px;font-weight:680;letter-spacing:-.03em;line-height:1;min-width:56px}
.cdform{display:grid;gap:8px;background:var(--tint);border-radius:18px;padding:12px}.cdform input{height:42px;border:0;border-radius:12px;background:var(--surface);color:var(--ink);padding:0 12px;font:inherit}
.gal{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:var(--tint)}.gal .grow{flex:1;min-width:0}.gal .t2x{white-space:normal}

/* ===================== glass ===================== */
:root{
  --bg:#dfe9fb;--surface:rgba(255,255,255,.60);--tint:rgba(255,255,255,.52);--line:rgba(255,255,255,.72);
  --ink2:#44546c;--ink3:#667791;--accent:#3a68e0;
  --blur:blur(22px) saturate(1.6);--blur-lg:blur(32px) saturate(1.7);
  --edge:inset 0 1px 0 rgba(255,255,255,.9),inset 0 0 0 1px rgba(255,255,255,.35);
  --lift:0 10px 30px rgba(40,64,128,.15);--shadow:0 2px 6px rgba(40,64,128,.06),0 14px 40px rgba(40,64,128,.16);
  --t1:linear-gradient(160deg,rgba(160,205,255,.78),rgba(96,150,240,.62));--t2:linear-gradient(160deg,rgba(255,226,190,.82),rgba(240,185,130,.64));
  --t3:linear-gradient(160deg,rgba(185,240,214,.8),rgba(90,200,160,.6));--t4:linear-gradient(160deg,rgba(225,205,255,.82),rgba(170,130,240,.62));--t5:linear-gradient(160deg,rgba(255,205,230,.82),rgba(240,130,185,.6));
  --glow1:rgba(92,140,255,.62);--glow2:rgba(188,128,255,.50);--glow3:rgba(64,214,190,.46);--glow4:rgba(255,168,128,.46);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#070b16;--surface:rgba(30,42,72,.52);--tint:rgba(255,255,255,.075);--line:rgba(255,255,255,.15);
  --ink2:#b3bfd4;--ink3:#8997b0;--accent:#7aa0ff;
  --edge:inset 0 1px 0 rgba(255,255,255,.18),inset 0 0 0 1px rgba(255,255,255,.05);
  --lift:0 10px 30px rgba(0,0,0,.4);--shadow:0 2px 6px rgba(0,0,0,.3),0 14px 40px rgba(0,0,0,.45);

const SYM={INR:'₹',USD:'$',EUR:'€',GBP:'£'};const money=(c,n)=>(SYM[c]||(c?c+' ':''))+Number(n).toLocaleString(undefined,{maximumFractionDigits:2});
const dayDiff=d=>Math.round((new Date(new Date(d).toDateString())-new Date(new Date().toDateString()))/864e5);

  const time=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),n=dayDiff(d);return n===0?`Today ${time}`:n===1?`Tomorrow ${time}`:d.toLocaleDateString(undefined,{day:'numeric',month:'short'})+' '+time}
function smartLine(h){
  const due=h.reminders.find(r=>new Date(r.when)<Date.now());if(due)return{text:`Due now: ${due.text}`};
  const soon=(h.subscriptions||[]).map(s=>({s,d:s.next_charge?dayDiff(s.next_charge):null})).filter(x=>x.d!=null&&x.d>=0&&x.d<=3).sort((a,b)=>a.d-b.d)[0];
  if(soon)return{text:`${soon.s.name} renews ${soon.d===0?'today':soon.d===1?'tomorrow':'in '+soon.d+' days'}${soon.s.amount?' · '+money(soon.s.currency,soon.s.amount):''}`,act:`Remind me the day before ${soon.s.name} renews`,label:'Remind me'};
  const next=h.reminders[0];if(next&&dayDiff(next.when)===0)return{text:`Next: ${next.text} · ${when(next.when)}`};
  if(h.tasks.length)return{text:`${h.tasks.length} open task${h.tasks.length>1?'s':''} today`};
  return{text:'You are all caught up.'};
}

  quick:()=>({html:'<div class="qgrid">'+[['q1','Plan my day','ask','Plan my day using my tasks, reminders and emails'],['q2','Unread email','ask','What is new in my email that needs attention?'],['q3','Subscriptions','ask','Find my subscriptions and what they cost'],['q4','Research…','fill','Research this and cite sources: ']].map(q=>`<button class="${q[0]}" data-${q[2]}="${esc(q[3])}">${q[1]}</button>`).join('')+'</div>'}),

const WX={0:['sun','Clear'],1:['sun','Mostly clear'],2:['cloud','Partly cloudy'],3:['cloud','Overcast'],45:['fog','Fog'],48:['fog','Fog'],51:['rain','Drizzle'],53:['rain','Drizzle'],55:['rain','Drizzle'],61:['rain','Rain'],63:['rain','Rain'],65:['rain','Heavy rain'],71:['snow','Snow'],73:['snow','Snow'],75:['snow','Snow'],80:['rain','Showers'],81:['rain','Showers'],82:['bolt2','Heavy showers'],95:['bolt2','Thunderstorm'],96:['bolt2','Thunderstorm'],99:['bolt2','Thunderstorm']};
let wxFull=null,wxAt=0;
function wxHTML(){

  if(wxFull.none)return'<div class="quiet">Set your city to see the forecast. <button class="linkbtn" data-go="settings">Set location</button></div>';
  if(wxFull.err)return'<div class="quiet">Weather is unavailable right now.</div>';
  const w=WX[wxFull.code]||['cloud','—'];
  return`<div class="wxnow"><div class="wxbig num">${wxFull.temp}°</div><div class="grow" style="flex:1;min-width:0"><div class="t1x">${esc(w[1])}</div><div class="t2x">${esc(wxFull.city)} · H ${wxFull.hi}° L ${wxFull.lo}°</div></div>${ico(w[0],'style="width:34px;height:34px"')}</div><div class="wxrow">${wxFull.hours.map(x=>`<div class="wxh"><span>${esc(x.t)}</span>${ico((WX[x.code]||['cloud'])[0])}<b class="num">${x.temp}°</b></div>`).join('')}</div>`;
}

async function weather(){
  let c;try{c=JSON.parse(ls.get('city')||'null')}catch{}
  if(!c){wxTile={v:'Set city',l:'Weather',icon:'pin'};wxFull={none:true}}
  else if(wxFull&&!wxFull.none&&!wxFull.err&&Date.now()-wxAt<600000&&wxFull.city===c.name){/* fresh enough */}
  else try{
    const r=await(await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}&current=temperature_2m,weather_code&hourly=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=2`)).json();
    const cur=r.current,w=WX[cur.weather_code]||['cloud','—'];
    const now=String(cur.time).slice(0,13)+':00',i=r.hourly.time.findIndex(t=>t>=now);
    const hours=r.hourly.time.slice(i+1,i+7).map((t,k)=>({t:new Date(t).toLocaleTimeString([],{hour:'numeric'}),temp:Math.round(r.hourly.temperature_2m[i+1+k]),code:r.hourly.weather_code[i+1+k]}));
    wxFull={temp:Math.round(cur.temperature_2m),code:cur.weather_code,city:c.name,hi:Math.round(r.daily.temperature_2m_max[0]),lo:Math.round(r.daily.temperature_2m_min[0]),hours};wxAt=Date.now();
    wxTile={v:wxFull.temp+'°',l:`${w[1]} · ${c.name}`,icon:w[0]};
  }catch{wxTile={v:'—',l:'Weather unavailable',icon:'cloud'};wxFull={err:true}}
  if(lastHome)tiles(lastHome,lastHome.gmail?lastMail:null);wxRefresh();
}

/* ---------- settings ---------- */
function openSheet(){$('#scrim').classList.add('on');$('#sheet').classList.add('on');try{$('#city').value=(JSON.parse(ls.get('city')||'null')||{}).name||''}catch{}}
function closeSheet(){$('#scrim').classList.remove('on');$('#sheet').classList.remove('on');$('#gallery').classList.remove('on')}
$('#settings').onclick=openSheet;$('#scrim').onclick=closeSheet;$('#ver').textContent=hp.get('v')||'web';
$('#tokform').onsubmit=e=>{e.preventDefault();const v=$('#tokin').value.trim();if(!v)return;tok=v;ls.set('tok',v);bridgeToken(v);$('#tokin').value='';closeSheet();toast('Token updated');load()};
$('#cityform').onsubmit=async e=>{e.preventDefault();const n=$('#city').value.trim();if(!n)return;
  try{const g=await(await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(n))).json();
    if(!g.results||!g.results[0]){toast('City not found');return}
    const x=g.results[0];ls.set('city',JSON.stringify({name:x.name,lat:x.latitude,lon:x.longitude}));closeSheet();weather();toast('Location saved')}catch{toast('Could not look up that city')}};

/* ---------- boot ---------- */
(async()=>{
  renderFocus();
  try{const h=await api('history');for(const m of Array.isArray(h)?h:[])addMsg(m.content,m.role==='user'?'me':'bot',m.t||null)}catch{}
  emptyHint();
  go(ls.get('tab')==='chat'?'chat':'home');weather();
  setInterval(()=>{if(tabName==='home')load()},30000);
  setInterval(async()=>{try{const n=await api('notifications');if(!Array.isArray(n))return;
    for(const x of n){addMsg(`${x.title}: ${x.body}`,'sys');vib();if(tabName!=='chat'){unread++;badge()}
      try{if(!IN_APP&&'Notification' in window&&Notification.permission==='granted')new Notification(x.title,{body:x.body})}catch{}}
    if(n.length)load()}catch{}},15000);
  try{if(!IN_APP&&'Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch{}
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
