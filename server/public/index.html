<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Assistant</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827">
<style>
:root{--bg:#fff;--fg:#111827;--card:#f3f4f6;--me:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#e5e7eb;--card:#1f2937}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui;display:flex;flex-direction:column;height:100dvh}
header{padding:12px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
header button{background:none;border:0;color:inherit;font-size:14px;opacity:.7}
#log{flex:1;overflow:auto;padding:0 16px}
.m{max-width:85%;margin:8px 0;padding:10px 12px;border-radius:14px;background:var(--card);white-space:pre-wrap}
.me{margin-left:auto;background:var(--me);color:#fff}
.act{display:flex;gap:8px;margin-top:8px}.act button{padding:8px 14px;border-radius:10px;border:0;font-size:15px}
.ok{background:#16a34a;color:#fff}.no{background:#9ca3af;color:#fff}
form{display:flex;gap:8px;padding:12px 16px}input{flex:1;padding:12px;border-radius:12px;border:1px solid #9ca3af;background:var(--bg);color:var(--fg);font-size:16px}
form button{padding:0 18px;border:0;border-radius:12px;background:var(--me);color:#fff;font-size:16px}
</style></head><body>
<header>Assistant <button id="set">token</button></header>
<div id="log"></div>
<form id="f"><input id="q" placeholder="Remind me, check email, book a ticket…" autocomplete="off"><button>Send</button></form>
<script>
const ht=new URLSearchParams(location.hash.slice(1)).get('t');if(ht)localStorage.tok=ht;
let tok=localStorage.tok||prompt('App token')||'dev-token';localStorage.tok=tok;
set.onclick=()=>{tok=prompt('App token',tok)||tok;localStorage.tok=tok};
const api=(p,b)=>fetch('/api/'+p,{method:b?'POST':'GET',headers:{'content-type':'application/json',authorization:'Bearer '+tok},body:b&&JSON.stringify(b)}).then(r=>r.json());
const add=(t,c='')=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.appendChild(d);log.scrollTop=1e9;return d};
f.onsubmit=async e=>{e.preventDefault();const t=q.value.trim();if(!t)return;q.value='';add(t,'me');const w=add('…');
 const r=await api('chat',{message:t});w.textContent=r.reply||r.error||'(no reply)';
 for(const p of r.pending||[]){const d=add(`Confirm: ${p.tool} ${JSON.stringify(p.input)}`);const a=document.createElement('div');a.className='act';
  for(const [l,ap,c] of [['Confirm',true,'ok'],['Cancel',false,'no']]){const b=document.createElement('button');b.textContent=l;b.className=c;
   b.onclick=async()=>{a.remove();const x=await api('confirm/'+p.id,{approve:ap});add(ap?'Done: '+JSON.stringify(x.result):'Cancelled')};a.appendChild(b)}d.appendChild(a)}};
async function poll(){try{const n=await api('notifications');for(const x of n){add(x.title+': '+x.body);
 if(Notification.permission==='granted')new Notification(x.title,{body:x.body})}}catch{}}
if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
setInterval(poll,15000);poll();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
